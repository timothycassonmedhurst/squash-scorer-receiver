<!DOCTYPE html>
<html>
<head>
    <title>Squash Scorer Plus Receiver</title>
    <style type="text/css">
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            background: linear-gradient(to right, #222, #444, #222);
            border-bottom: 2px solid #555;
        }

        .header img {
            height: 45px;
            margin-right: 20px;
        }

        .header h1 {
            font-size: 36px;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .header .scorer-text {
            color: #9c27b0;
            margin-left: 10px;
        }

        .header .timer-text {
            position: absolute;
            right: 40px;
            font-size: 27px;
            font-weight: bold;
            color: #ffeb3b;
        }

        .names-row {
            display: flex;
            justify-content: space-around;
            padding: 20px 40px 0 40px;
            width: 100%;
            box-sizing: border-box;
        }

        .player-name {
            font-size: 6vw;
            font-weight: bold;
            text-transform: uppercase;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            white-space: normal;
            flex: 1;
            text-align: center;
            line-height: 1.1;
            max-height: 2.2em; /* Ensure it doesn't exceed two lines */
        }

        .player-name.team-a {
            color: #8bc34a;
            padding-right: 20px;
        }

        .player-name.team-b {
            color: #ff9800;
            padding-left: 20px;
        }

        .main-score-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 40px;
        }

        .serving-container {
            width: 15vw;
            text-align: center;
        }

        .serving-indicator {
            visibility: hidden;
        }

        .serving-indicator.visible {
            visibility: visible;
        }

        .serving-text {
            font-size: 2.5vw;
            font-weight: bold;
        }

        #servingA .serving-text {
            color: #8bc34a; /* Team A color */
        }

        #servingB .serving-text {
            color: #ff9800; /* Team B color */
        }

        .server-side {
            color: #fff;
            font-size: 2vw;
            margin-top: 5px;
            text-transform: uppercase;
        }

        .score {
            font-size: 25vw;
            font-weight: bold;
            color: #8bc34a; /* Team A color */
            min-width: 1.2em;
            text-align: center;
        }

        .team-b .score {
            color: #ff9800; /* Team B color */
        }

        #scoreB {
            color: #ff9800;
        }

        .divider {
            font-size: 15vw;
            color: #fff;
            margin: 0 20px;
        }

        .footer {
            background-color: #111;
            padding: 10px;
            display: flex;
            justify-content: space-around;
            border-top: 2px solid #333;
        }

        .game-score-item {
            text-align: center;
        }

        .game-label {
            color: #aaa;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .game-score {
            font-size: 24px;
            font-weight: bold;
        }

        .game-score .score-a { color: #8bc34a; }
        .game-score .score-b { color: #ff9800; }

        .match-info {
            position: absolute;
            bottom: 20px;
            right: 40px;
            font-size: 24px;
            color: #777;
        }

        .event-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 40px 80px;
            border-radius: 20px;
            border: 4px solid #9c27b0;
            font-size: 8vw;
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
            z-index: 1000;
            display: none;
            box-shadow: 0 0 50px rgba(156, 39, 176, 0.5);
        }

        .event-popup.animate-left {
            display: block;
            animation: expandFromLeft 0.5s ease-out forwards;
        }

        .event-popup.animate-right {
            display: block;
            animation: expandFromRight 0.5s ease-out forwards;
        }

        .event-popup.animate-center {
            display: block;
            animation: expandFromCenter 0.5s ease-out forwards;
        }

        @keyframes expandFromLeft {
            0% {
                left: 0;
                transform: translate(0, -50%) scaleX(0);
                opacity: 0;
            }
            100% {
                left: 50%;
                transform: translate(-50%, -50%) scaleX(1);
                opacity: 1;
            }
        }

        @keyframes expandFromRight {
            0% {
                left: 100%;
                transform: translate(-100%, -50%) scaleX(0);
                opacity: 0;
            }
            100% {
                left: 50%;
                transform: translate(-50%, -50%) scaleX(1);
                opacity: 1;
            }
        }

        @keyframes expandFromCenter {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        /* Timer Popup Styles */
        .timer-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border-radius: 30px;
            border: 5px solid #ffeb3b;
            z-index: 2000;
            display: none;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 100px rgba(0, 0, 0, 0.8);
        }

        .timer-label {
            font-size: 40px;
            color: #ffeb3b;
            margin-bottom: 30px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 5px;
        }

        .flip-clock {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .flip-unit {
            display: flex;
            gap: 10px;
        }

        .flip-card {
            background-color: #333;
            color: #fff;
            font-size: 120px;
            font-weight: bold;
            padding: 20px 30px;
            border-radius: 15px;
            min-width: 80px;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            background: linear-gradient(to bottom, #444 50%, #222 50%);
        }

        .flip-card::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background-color: rgba(0,0,0,0.5);
            transform: translateY(-50%);
        }

        .flip-separator {
            font-size: 100px;
            color: #fff;
            font-weight: bold;
            padding-bottom: 20px;
        }

        .timer-popup.paused {
            border-color: #ff9800;
            opacity: 0.8;
        }

        .timer-popup.expired {
            border-color: #f44336;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Hide elements when timer is active */
        body.timer-active .main-score-area {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="eventPopup" class="event-popup"></div>

    <div id="timerPopup" class="timer-popup">
        <div id="timerLabel" class="timer-label">WARM UP</div>
        <div class="flip-clock">
            <div class="flip-unit">
                <div id="minTens" class="flip-card">0</div>
                <div id="minUnits" class="flip-card">0</div>
            </div>
            <div class="flip-separator">:</div>
            <div class="flip-unit">
                <div id="secTens" class="flip-card">0</div>
                <div id="secUnits" class="flip-card">0</div>
            </div>
        </div>
    </div>

    <div class="header">
        <h1>SQUASH <span class="scorer-text">SCORER</span></h1>
        <div id="matchDuration" class="timer-text"></div>
    </div>

    <div class="names-row">
        <div id="playerA" class="player-name team-a">Waiting...</div>
        <div id="playerB" class="player-name team-b">Waiting...</div>
    </div>

    <div class="main-score-area">
        <div class="serving-container">
            <div id="servingA" class="serving-indicator">
                <div class="serving-text">SERVING</div>
                <div id="serverSideA" class="server-side"></div>
            </div>
        </div>

        <div id="scoreA" class="score">-</div>
        <div class="divider">-</div>
        <div id="scoreB" class="score">-</div>

        <div class="serving-container">
            <div id="servingB" class="serving-indicator">
                <div class="serving-text">SERVING</div>
                <div id="serverSideB" class="server-side"></div>
            </div>
        </div>
    </div>

    <div id="previousGames" class="footer">
        <!-- Previous game scores will be injected here -->
    </div>

    <script type="text/javascript" src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <script type="text/javascript" src="receiver.js"></script>
</body>
</html>
